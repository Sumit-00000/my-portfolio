name: telemetry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "sumit-portfolio/telemetry/**"

permissions:
  contents: write

# Overlapping runs cancel instead of racing each other to push
concurrency:
  group: telemetry
  cancel-in-progress: true

defaults:
  run:
    working-directory: sumit-portfolio

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sumit-portfolio/package-lock.json

      - run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Measure first-load JS
        run: node scripts/measure-first-load.mjs

      - name: Lighthouse (3 runs against the built site)
        run: |
          npx --yes @lhci/cli@0.14.x collect \
            --numberOfRuns=3 \
            --start-server-command="npm run start" \
            --url="http://localhost:3000/" \
            --settings.preset=desktop

      - name: Extract median scores
        run: node scripts/extract-lighthouse.mjs

      - name: Commit measurements
        run: |
          git config user.name "telemetry-bot"
          git config user.email "actions@github.com"
          git add telemetry/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore(telemetry): measurements for ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push
